name: Go backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
      - name: Test and validate
        working-directory: app/server
        run: |
          go test ./...
          go vet ./...
          go run . validate -content-dir ../content
      - name: Exercise the release image
        shell: bash
        run: |
          bash app/server/smoke-image.sh checked-out
          bash app/server/smoke-image.sh renamed
          bash app/server/smoke-image.sh empty
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:worker
        env:
          TEST_API_CONTAINER: "1"
