name: Cloudflare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, production]
        default: staging
      operation:
        type: choice
        options: [deploy, restore]
        default: deploy
      restore_sha:
        description: Full Git SHA of a previously deployed release
        type: string
      restore_version:
        description: Cloudflare Worker version ID from that release's deployment summary
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-release-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.operation != 'restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: VITE_RELEASE_SHA="$GITHUB_SHA" npm run build
      - name: Test and export the release
        working-directory: app/server
        run: |
          go test ./...
          go vet ./...
          go run . export -content-dir ../content -release-dir "$RUNNER_TEMP/content-release" -sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: content-release
          path: ${{ runner.temp }}/content-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: app/client/dist/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-content', inputs.target || 'production') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: content-release
          path: ${{ runner.temp }}/content-release/
      - name: Upload immutable media, manifest, and snapshot and verify stored bytes
        working-directory: app/server
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_WRITE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_WRITE_SECRET_ACCESS_KEY }}
        run: go run . publish -release-dir "$RUNNER_TEMP/content-release" -sha "$GITHUB_SHA"

  activate:
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: client
          path: app/client/dist/
      - uses: actions/download-artifact@v4
        with:
          name: content-release
          path: ${{ runner.temp }}/content-release/
      - name: Pin the image and deploy the matching Worker version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          config=deploy/cloudflare/wrangler.release.json
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f -- "$config" "$secrets_file"' EXIT
          local_image="billiam-api:$GITHUB_SHA"
          docker build --platform linux/amd64 --build-arg "GIT_SHA=$GITHUB_SHA" -f app/server/Dockerfile -t "$local_image" .
          npm exec -- wrangler containers push "$local_image"
          registry_tag="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$local_image"
          image=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$registry_tag" | grep -F "registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/billiam-api@sha256:")
          node deploy/cloudflare/prepare-release.mjs "$GITHUB_SHA" "$image" "$config" "$secrets_file"
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/worker-deploy.jsonl"
          npm exec -- wrangler deploy --config "$config" --autoconfig=false --tag "$GITHUB_SHA" --secrets-file "$secrets_file"
          version=$(jq -ers 'map(select(.type == "deploy") | .version_id) | last | select(test("^[0-9a-f-]{36}$"))' "$WRANGLER_OUTPUT_FILE_PATH")
          printf 'Git SHA: `%s`\n\nWorker version: `%s`\n\nAPI image: `%s`\n' "$GITHUB_SHA" "$version" "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the active release
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: node deploy/cloudflare/verify-release.mjs "$SITE_ORIGIN" "$RUNNER_TEMP/content-release" "$GITHUB_SHA"

  restore:
    if: inputs.operation == 'restore'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/server/go.mod
          cache-dependency-path: app/server/go.sum
      - run: npm ci
      - name: Export the expected content from the selected Git release
        env:
          RESTORE_SHA: ${{ inputs.restore_sha }}
        run: |
          [[ "$RESTORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$RESTORE_SHA"
          git archive "$RESTORE_SHA" app/content | tar -x -C "$RUNNER_TEMP"
          cd app/server
          go run . export -content-dir "$RUNNER_TEMP/app/content" -release-dir "$RUNNER_TEMP/content-release" -sha "$RESTORE_SHA"
      - name: Restore the retained Worker, assets, and image together
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          RESTORE_SHA: ${{ inputs.restore_sha }}
          RESTORE_VERSION: ${{ inputs.restore_version }}
        run: |
          set -euo pipefail
          [[ "$RESTORE_VERSION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          npm exec -- wrangler versions view --name "$WORKER_NAME" "$RESTORE_VERSION" --json |
            jq -e --arg sha "$RESTORE_SHA" '.annotations["workers/tag"] == $sha and any(.resources.bindings[]; .name == "RELEASE_SHA" and .type == "plain_text" and .text == $sha)' >/dev/null
          npm exec -- wrangler versions deploy --name "$WORKER_NAME" "$RESTORE_VERSION@100%" --yes
      - name: Verify the restored release
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          RESTORE_SHA: ${{ inputs.restore_sha }}
        run: node deploy/cloudflare/verify-release.mjs "$SITE_ORIGIN" "$RUNNER_TEMP/content-release" "$RESTORE_SHA"
